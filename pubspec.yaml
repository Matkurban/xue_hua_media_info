name: xue_hua_media_info
description: "Cross-platform native Flutter plugin for reading image EXIF and video/audio metadata on Android/iOS/macOS/Windows/Linux/Web"
version: 2.1.6
repository: https://github.com/Matkurban/xue_hua_media_info
issue_tracker: https://github.com/Matkurban/xue_hua_media_info/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.18.3
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: com.xuehua.xue_hua_media_info_android
        pluginClass: XueHuaMediaInfoAndroidPlugin
      ios:
        pluginClass: XueHuaMediaInfoDarwinPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: XueHuaMediaInfoDarwinPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: XueHuaMediaInfoWindowsPluginCApi
      linux:
        pluginClass: XueHuaMediaInfoLinuxPlugin
      web:
        pluginClass: XueHuaMediaInfoWebPlugin
        fileName: xue_hua_media_info_web.dart
