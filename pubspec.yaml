# xue_hua_media_info monorepo workspace root.
# xue_hua_media_info 联合插件（Federated Plugin）单仓工作区根配置。
name: xue_hua_media_info_workspace
description: "Workspace for the xue_hua_media_info federated media metadata plugin. / xue_hua_media_info 联合媒体元数据插件工作区。"
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/xue_hua_media_info
  - packages/xue_hua_media_info/example
  - packages/xue_hua_media_info_platform_interface
  - packages/xue_hua_media_info_android
  - packages/xue_hua_media_info_darwin
  - packages/xue_hua_media_info_web
  - packages/xue_hua_media_info_windows
  - packages/xue_hua_media_info_linux

dev_dependencies:
  melos: ^8.3.0

# Melos 7+ reads its configuration from this pubspec.
# Melos 7 及以上版本从本 pubspec 读取配置。
melos:
  scripts:
    analyze:
      description: "Run static analysis in every package. / 对所有包运行静态分析。"
      exec:
        command: dart analyze .
        concurrency: 4

    test:
      description: "Run unit tests in packages that have a test/ dir. / 对包含 test/ 目录的包运行单元测试。"
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test

    pigeon:
      description: "Regenerate Pigeon bindings for all platforms. / 重新生成所有平台的 Pigeon 绑定代码。"
      exec:
        command: dart run pigeon --input pigeons/messages.dart
        concurrency: 1
      packageFilters:
        fileExists: pigeons/messages.dart
