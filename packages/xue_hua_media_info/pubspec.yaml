name: xue_hua_media_info
description: "Cross-platform native Flutter plugin for reading image EXIF and video/audio metadata on Android/iOS/macOS/Windows/Linux/Web. / 跨平台原生 Flutter 插件——读取图片 EXIF 与视频/音频元数据，覆盖六大平台。"
version: 2.0.0
repository: https://github.com/Matkurban/xue_hua_media_info
issue_tracker: https://github.com/Matkurban/xue_hua_media_info/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  xue_hua_media_info_platform_interface: ^2.0.0
  xue_hua_media_info_android: ^2.0.0
  xue_hua_media_info_darwin: ^2.0.0
  xue_hua_media_info_web: ^2.0.0
  xue_hua_media_info_windows: ^2.0.0
  xue_hua_media_info_linux: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: xue_hua_media_info_android
      ios:
        default_package: xue_hua_media_info_darwin
      macos:
        default_package: xue_hua_media_info_darwin
      web:
        default_package: xue_hua_media_info_web
      windows:
        default_package: xue_hua_media_info_windows
      linux:
        default_package: xue_hua_media_info_linux
