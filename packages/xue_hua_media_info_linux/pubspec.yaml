name: xue_hua_media_info_linux
description: "Linux implementation of the xue_hua_media_info plugin, using GStreamer and in-tree JPEG/PNG parsers. / xue_hua_media_info 插件的 Linux 实现，基于 GStreamer 与仓内 JPEG/PNG 解析。"
version: 2.0.0
repository: https://github.com/Matkurban/xue_hua_media_info
issue_tracker: https://github.com/Matkurban/xue_hua_media_info/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  xue_hua_media_info_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: xue_hua_media_info
    platforms:
      linux:
        pluginClass: XueHuaMediaInfoLinuxPlugin
